name: 📅 Isometric commit calendar
category: github
description: |
  This plugin displays an isometric view of a user commit calendar along with a few additional statistics like current streak and average number of commit per day.
examples:
  +full year calendar: https://github.com/lowlighter/metrics/blob/examples/metrics.plugin.isocalendar.fullyear.svg
  half year calendar: https://github.com/lowlighter/metrics/blob/examples/metrics.plugin.isocalendar.svg
index: 0
supports:
  - user
scopes:
  - public_access
inputs:

  plugin_isocalendar:
    description: |
      Enable isocalendar plugin
    type: boolean
    default: no

  plugin_isocalendar_duration:
    description: |
      Time range

      - `half-year`: 180 days
      - `full-year`: 1 year
    type: string
    default: half-year
    values:
      - half-year
      - full-year

  plugin_isocalendar_sources:
    description: |
      External contributions sources

      Contributions from these sources are merged by date with GitHub contributions and stacked on calendar.
      Each source is an object with a `type`, an optional `name` and an optional `color`, along with type specific settings.
      When `color` is not set, per day colors from source data are used if available, or a default color for source type otherwise.

      - `file`: JSON file served over http(s)
        - `url`: File URL (mandatory)
        - `headers`: Additional request headers (e.g. `{"Authorization": "token ..."}` for private files)
        - Accepted formats are `[{"date": "YYYY-MM-DD", "contributionCount": 1, "color": "#fc6d26"}]` (`color` is optional) and `{"YYYY-MM-DD": 1}` (GitLab's `/users/:username/calendar.json`)
      - `gitlab`: GitLab events API (gitlab.com or self-hosted)
        - `url`: GitLab instance URL (defaults to `https://gitlab.com`)
        - `token`: GitLab personal access token with `read_user` scope (mandatory, use a secret)
        - `count`: `events` to count each event like GitLab calendar does (default), or `commits` to count pushed commits

      Instance must be reachable from runner for `gitlab` sources.
    type: json
    default: "[]"
    example: |
      [{"type": "gitlab", "name": "work", "url": "https://gitlab.example.com", "token": "${{ secrets.GITLAB_TOKEN }}"}]