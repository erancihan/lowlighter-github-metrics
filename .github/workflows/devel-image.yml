# Create a Docker image for development and publish it to GitHub registry.
name: Create Development Image

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  docker-devel:
    name: Publish devel to GitHub registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Layers are cached in GitHub Actions cache, so only changed layers are rebuilt
      - name: Build and publish docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lowlighter-github-metrics:devel
          cache-from: type=gha
          cache-to: type=gha,mode=max
