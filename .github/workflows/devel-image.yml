# Create a Docker image for development and publish it to GitHub registry.
name: Create Development Image

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  docker-devel:
    name: Publish devel to GitHub registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub registry
        run: echo ${{ github.token }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/lowlighter-github-metrics:devel .

      - name: Publish to GitHub registry
        run: docker push ghcr.io/${{ github.repository_owner }}/lowlighter-github-metrics:devel
